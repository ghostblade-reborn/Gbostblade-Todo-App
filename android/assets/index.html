<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GhostBlade Task</title>
<style>
/* ================= Apple Liquid Glass UI =================
   Dark glass system: translucent surfaces, backdrop blur + saturation,
   specular top highlight, soft refraction border, floating pill tab bar.
   Wallpaper aurora sits behind everything so the glass has light to bend. */
:root{
  --bg:#06060a;
  --glass:rgba(255,255,255,.075);
  --glass-strong:rgba(30,30,40,.55);
  --glass-soft:rgba(255,255,255,.05);
  --stroke:rgba(255,255,255,.16);
  --stroke-soft:rgba(255,255,255,.09);
  --hi:rgba(255,255,255,.28);
  --text:#f5f5f7; --muted:rgba(235,235,245,.55);
  --red:#ff453a; --red2:#e44332; --green:#30d158; --orange:#ff9f0a; --blue:#0a84ff; --gold:#ffd60a;
  --blur:blur(24px) saturate(200%);
  --shadow:0 10px 34px rgba(0,0,0,.42), inset 0 1px 0 var(--hi), inset 0 -1px 0 rgba(255,255,255,.04);
  --panel:#232329; --panel2:#2b2b33; --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;color:var(--text);font-size:15px;background:var(--bg);
  font-family:"SF Pro Display","SF Pro Text",-apple-system,system-ui,Roboto,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
/* aurora wallpaper the glass refracts */
.wallpaper{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
  radial-gradient(120% 90% at 85% -10%, rgba(120,110,255,.65), transparent 55%),
  radial-gradient(100% 80% at -10% 25%, rgba(20,150,255,.55), transparent 55%),
  radial-gradient(90% 70% at 110% 65%, rgba(255,60,110,.45), transparent 55%),
  radial-gradient(120% 100% at 15% 110%, rgba(50,220,120,.30), transparent 55%),
  radial-gradient(70% 50% at 60% 45%, rgba(255,170,40,.18), transparent 60%),
  linear-gradient(180deg,#0b0b18,#06060a)}
.wallpaper::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 50% at 50% 0%,rgba(255,255,255,.05),transparent 70%)}
#app{max-width:640px;margin:0 auto;padding:0 0 118px}
/* glass mixin look, applied per-element below */
header.top{position:sticky;top:10px;z-index:5;margin:10px 12px 4px;padding:14px 16px 12px;border-radius:26px;
  background:linear-gradient(165deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 42%,rgba(255,255,255,0) 62%),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);box-shadow:var(--shadow)}
header.top h1{font-size:22px;margin:0 0 2px;font-weight:700;letter-spacing:-.02em}
header.top .sub{color:var(--muted);font-size:13px}
header.top .sub b{color:var(--text)}
.prog{height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:10px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.prog>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--red2),#ff6a5e);box-shadow:inset 0 1px 0 rgba(255,255,255,.45);transition:width .3s}
main{padding:6px 14px}
.daygroup{color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:18px 2px 8px}
.daygroup .today-lbl{color:var(--green)}
/* tasks become individual glass pills */
.task{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;margin:0 0 9px;border-radius:20px;
  background:linear-gradient(165deg,rgba(255,255,255,.15),rgba(255,255,255,.02) 45%,rgba(255,255,255,0) 65%),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);box-shadow:0 6px 22px rgba(0,0,0,.30), inset 0 1px 1px rgba(255,255,255,.35), inset 0 -1px 1px rgba(255,255,255,.06)}
.check{flex:0 0 auto;width:23px;height:23px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.06);margin-top:1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.check.p1{border-color:var(--red);background:rgba(255,69,58,.20)}
.check.p2{border-color:var(--orange)}
.check.p3{border-color:var(--blue)}
.check:active{background:var(--red)}
.task .body{flex:1;min-width:0}
.task .title{font-size:15.5px;line-height:1.35;word-wrap:break-word;font-weight:500;letter-spacing:-.01em}
.task .meta{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;flex-wrap:wrap;gap:8px}
.task .meta .due{color:var(--green)}
.task .meta .over{color:#ff6961}
.task .meta .proj{color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:38px 12px;font-size:14px;line-height:1.6}
.empty .big{font-size:34px;display:block;margin-bottom:8px}
/* floating glass tab bar */
nav.bottom{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;max-width:612px;margin:0 auto;
  display:flex;justify-content:space-around;padding:8px;border-radius:34px;
  background:rgba(255,255,255,.10);-webkit-backdrop-filter:blur(28px) saturate(210%);backdrop-filter:blur(28px) saturate(210%);
  border:1px solid var(--stroke);box-shadow:0 16px 44px rgba(0,0,0,.5), inset 0 1px 0 var(--hi), inset 0 -1px 0 rgba(255,255,255,.05)}
nav.bottom button{background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 14px;border-radius:24px;transition:background .2s,color .2s}
nav.bottom button .ic{font-size:20px;line-height:1}
nav.bottom button.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.16));box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55), inset 0 -1px 1px rgba(255,255,255,.12), 0 6px 18px rgba(0,0,0,.30)}
/* glass FAB */
#fab{position:fixed;right:18px;bottom:104px;z-index:7;width:57px;height:57px;border-radius:50%;color:#fff;font-size:31px;line-height:1;
  border:1px solid rgba(255,255,255,.35);
  background:linear-gradient(180deg,rgba(255,106,94,.85),rgba(228,67,50,.78));
  -webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);
  box-shadow:0 12px 30px rgba(228,67,50,.40), inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -2px 6px rgba(0,0,0,.18)}
#fab:active{filter:brightness(1.12)}
/* glass sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(2,2,8,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:10}
.sheet{position:fixed;left:8px;right:8px;bottom:8px;z-index:11;border-radius:32px;padding:20px 18px 18px;max-height:88vh;overflow-y:auto;max-width:624px;margin:0 auto;
  background:rgba(32,32,44,.62);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  border:1px solid var(--stroke);box-shadow:0 -12px 50px rgba(0,0,0,.5), inset 0 1.5px 0 var(--hi)}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sheet input[type=text],.sheet textarea,.sheet select,.sheet input[type=date],.sheet input[type=time],.sheet input[type=number]{
  width:100%;border-radius:13px;color:var(--text);padding:11px 12px;font-size:15px;margin:0 0 10px;
  background:rgba(255,255,255,.07);border:1px solid var(--stroke-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.sheet textarea{min-height:74px;resize:vertical}
textarea#rambleText,textarea#assistText,textarea#ioText{width:100%;border-radius:16px;color:var(--text);padding:12px;font-size:15px;margin:0 0 10px;
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--stroke-soft);min-height:96px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{border-radius:14px;padding:4px 11px;font-size:12.5px;color:var(--text);
  background:rgba(255,255,255,.10);border:1px solid var(--stroke-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.chip.red{border-color:rgba(255,69,58,.6);color:#ff9d97}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.btn{border-radius:999px;padding:12px 16px;font-size:15px;font-weight:600;border:1px solid transparent}
.btn.red{color:#fff;width:100%;background:linear-gradient(180deg,#ff5a4d,#e44332);box-shadow:0 8px 22px rgba(228,67,50,.35), inset 0 1.5px 0 rgba(255,255,255,.45)}
.btn.ghost{color:var(--text);width:100%;background:rgba(255,255,255,.09);border-color:var(--stroke-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.btn.danger{background:transparent;color:#ff6961;width:100%}
.btn.small{width:auto;padding:8px 14px;font-size:13.5px}
label.lbl{display:block;color:var(--muted);font-size:12.5px;margin:8px 0 4px}
/* glass cards + menu */
.card{border-radius:26px;padding:15px 16px;margin:10px 0;background:linear-gradient(165deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 45%,rgba(255,255,255,0) 65%),var(--glass);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke-soft);box-shadow:0 8px 28px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.17)}
.card h4{margin:0 0 6px;font-size:15.5px;font-weight:700}
.card .muted{color:var(--muted);font-size:13px;line-height:1.55}
.menuitem{display:flex;align-items:center;gap:12px;width:100%;color:var(--text);padding:13px 14px;font-size:15px;text-align:left;margin:0 0 8px;
  background:linear-gradient(165deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 45%,rgba(255,255,255,0) 65%),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);border-radius:22px;box-shadow:inset 0 1px 1px rgba(255,255,255,.30)}
.menuitem .ic{font-size:19px;width:26px;text-align:center}
.menuitem .tag{margin-left:auto;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.4px}
.menuitem small{color:var(--muted);display:block;font-size:12.5px;margin-top:1px}
/* calendar glass tiles */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal .dow{color:var(--muted);font-size:11.5px;text-align:center;padding:4px 0}
.cal .day{border-radius:13px;min-height:46px;padding:4px;font-size:12.5px;color:var(--muted);
  background:rgba(255,255,255,.05);border:1px solid var(--stroke-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.cal .day.cur{color:var(--text)}
.cal .day.today{border-color:rgba(255,69,58,.75);background:rgba(255,69,58,.16);color:#fff}
.cal .day .n{display:block;font-weight:600}
.cal .day .cnt{display:inline-block;background:linear-gradient(180deg,#ff5a4d,#e44332);color:#fff;border-radius:8px;font-size:10.5px;padding:0 5px;margin-top:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
/* stats bars + ring */
.bars{display:flex;align-items:flex-end;gap:5px;height:74px;margin-top:8px}
.bars .bar{flex:1;background:rgba(255,255,255,.07);border-radius:5px 5px 0 0;position:relative;min-height:3px;overflow:hidden}
.bars .bar>i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#ff6a5e,#e44332);border-radius:5px 5px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.bars-lbl{display:flex;gap:5px;color:var(--muted);font-size:10.5px}
.bars-lbl span{flex:1;text-align:center}
.subtask{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--stroke-soft)}
.subtask .box{width:19px;height:19px;border-radius:6px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.05);flex:0 0 auto}
.subtask.done .box{background:var(--green);border-color:var(--green)}
.subtask.done .t{color:var(--muted);text-decoration:line-through}
.kpi{display:flex;gap:10px}
.kpi .card{flex:1;text-align:center}
.kpi .num{font-size:24px;font-weight:700}
.kpi .cap{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:170px;z-index:30;color:#fff;padding:11px 19px;border-radius:22px;font-size:14px;font-weight:500;
  background:rgba(40,40,54,.55);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--stroke);box-shadow:0 12px 32px rgba(0,0,0,.45), inset 0 1px 0 var(--hi)}
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;flex:0 0 auto}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:rgba(255,255,255,.12)}.ring .fgc{stroke:#ff5147;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
.ring text{fill:var(--text);font-size:19px;font-weight:700;text-anchor:middle}
select option{background:#23232e;color:#f5f5f7}
input[type=checkbox].asst-chk{accent-color:var(--red2)}
@media (prefers-reduced-transparency: reduce){
  header.top,.task,.card,.menuitem,.sheet,nav.bottom,.toast{backdrop-filter:none;-webkit-backdrop-filter:none;background:#23232e}
}

/* ---- Glass variants: Clear / Default / Tinted ---- */
body[data-glass="clear"]{--glass:rgba(255,255,255,.045);--stroke:rgba(255,255,255,.30);--stroke-soft:rgba(255,255,255,.18);--blur:blur(30px) saturate(230%)}
body[data-glass="tinted"]{--glass:rgba(16,16,24,.52);--stroke:rgba(255,255,255,.12);--stroke-soft:rgba(255,255,255,.07);--blur:blur(18px) saturate(150%)}
.chip.on{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.55);font-weight:700}

/* ================= ANIMATION SYSTEM (Apple-style motion) =================
   Signature easing: cubic-bezier(.32,.72,0,1) — fast start, long soft settle.
   Springs overshoot slightly for taps. Everything honours reduced-motion. */
:root{--spring:cubic-bezier(.32,.72,0,1);--spring-bouncy:cubic-bezier(.34,1.45,.44,1)}
/* --- view transitions: directional slide + fade --- */
@keyframes vinR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:translateX(0)}}
@keyframes vinL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:translateX(0)}}
@keyframes vinUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
#view.vin-r{animation:vinR .38s var(--spring) both}
#view.vin-l{animation:vinL .38s var(--spring) both}
#view.vin-up{animation:vinUp .34s var(--spring) both}
/* --- staggered row entrance --- */
@keyframes rowIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
#view .task,#view .menuitem,#view .card{animation:rowIn .45s var(--spring) both;animation-delay:calc(var(--i,0)*34ms)}
/* --- tap feedback: soft squash with spring release --- */
.task,.menuitem,.chip,.btn,nav.bottom button,.cal .day{transition:transform .22s var(--spring-bouncy),background .2s,box-shadow .25s var(--spring),filter .2s}
.task:active,.menuitem:active{transform:scale(.972)}
.chip:active,.cal .day:active{transform:scale(.93)}
.btn:active{transform:scale(.965)}
nav.bottom button{transition:transform .22s var(--spring-bouncy),background .3s var(--spring),box-shadow .3s var(--spring),color .2s}
nav.bottom button:active{transform:scale(.90)}
nav.bottom button.on .ic{display:inline-block;animation:pop .38s var(--spring-bouncy)}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
#fab{transition:transform .25s var(--spring-bouncy),filter .2s}
#fab:active{transform:scale(.87) rotate(45deg)}
.check{transition:transform .2s var(--spring-bouncy),background .2s}
.check:active{transform:scale(1.22)}
/* --- hold / long-press: glass lens deepens + rim brightens --- */
.pressing{transform:scale(.955)!important;filter:brightness(1.22) saturate(1.15);
  box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 1.5px 1px rgba(255,255,255,.55), inset 0 -1px 1px rgba(255,255,255,.14)!important;
  transition:transform .30s var(--spring),filter .30s,box-shadow .30s var(--spring)!important}
/* --- sheets: spring up, fade bg, swipe-down dismiss --- */
@keyframes sheetIn{from{opacity:.4;transform:translateY(56px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes sheetOut{to{opacity:0;transform:translateY(64px) scale(.985)}}
@keyframes bgIn{from{opacity:0}to{opacity:1}}
@keyframes bgOut{to{opacity:0}}
.sheet{animation:sheetIn .44s var(--spring) both}
.sheet.closing{animation:sheetOut .24s var(--spring) both;pointer-events:none}
.sheet-bg{animation:bgIn .3s ease both}
.sheet-bg.closing{animation:bgOut .24s ease both;pointer-events:none}
.sheet.dragging{animation:none;transition:none}
/* --- completion: pop, strike, melt away --- */
@keyframes donePop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(.97)}}
.task.completing{animation:donePop .26s var(--spring-bouncy) both, rowOut .3s var(--spring) .1s both}
@keyframes rowOut{to{opacity:0;transform:translateX(30px);margin-bottom:-6px}}
.task.completing .check{background:var(--green)!important;border-color:var(--green)!important;transform:scale(1.15)}
.task.completing .title{color:var(--muted);text-decoration:line-through}
/* --- toast + misc --- */
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.toast{animation:toastIn .36s var(--spring-bouncy) both}
.ring .fgc{transition:stroke-dashoffset .7s var(--spring)}
.prog>i{transition:width .55s var(--spring)}
@keyframes fabIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
#fab{animation:fabIn .5s var(--spring-bouncy) .1s both}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
}

/* ================= WALLPAPERS (Edit background) ================= */
body[data-wallpaper="sunset"] .wallpaper{background:radial-gradient(120% 90% at 85% -10%, rgba(255,140,60,.55), transparent 55%),radial-gradient(100% 80% at -10% 30%, rgba(255,60,110,.50), transparent 55%),radial-gradient(100% 90% at 50% 115%, rgba(120,40,180,.50), transparent 60%),linear-gradient(180deg,#160a18,#06060a)}
body[data-wallpaper="ocean"] .wallpaper{background:radial-gradient(120% 90% at 80% -10%, rgba(0,200,255,.50), transparent 55%),radial-gradient(100% 85% at -10% 40%, rgba(0,90,255,.50), transparent 55%),radial-gradient(110% 90% at 60% 115%, rgba(0,255,190,.28), transparent 60%),linear-gradient(180deg,#04101e,#06060a)}
body[data-wallpaper="forest"] .wallpaper{background:radial-gradient(120% 90% at 85% -10%, rgba(120,255,160,.40), transparent 55%),radial-gradient(100% 80% at -10% 30%, rgba(0,160,110,.45), transparent 55%),radial-gradient(110% 90% at 55% 115%, rgba(190,255,90,.22), transparent 60%),linear-gradient(180deg,#07130c,#06060a)}
body[data-wallpaper="crimson"] .wallpaper{background:radial-gradient(120% 90% at 85% -10%, rgba(255,70,60,.55), transparent 55%),radial-gradient(100% 80% at -10% 30%, rgba(160,0,40,.50), transparent 55%),radial-gradient(110% 90% at 55% 115%, rgba(255,120,40,.25), transparent 60%),linear-gradient(180deg,#170608,#06060a)}
body[data-wallpaper="mono"] .wallpaper{background:radial-gradient(120% 90% at 85% -10%, rgba(200,200,220,.20), transparent 55%),radial-gradient(100% 80% at -10% 40%, rgba(120,120,150,.18), transparent 55%),linear-gradient(180deg,#0c0c10,#06060a)}
.wp-row{display:flex;gap:9px;flex-wrap:wrap;margin:2px 0 11px}
.wp-swatch{width:44px;height:44px;border-radius:50%;border:2px solid var(--stroke-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(0,0,0,.3);padding:0;transition:transform .22s var(--spring-bouncy),border-color .2s}
.wp-swatch:active{transform:scale(.9)}
.wp-swatch.on{border-color:#fff;transform:scale(1.1)}
.wp-aurora{background:linear-gradient(135deg,#5e5ce6,#0a84ff 45%,#ff375f)}
.wp-sunset{background:linear-gradient(135deg,#ff8c3a,#ff3c6e 50%,#7828b4)}
.wp-ocean{background:linear-gradient(135deg,#00c8ff,#005aff 55%,#00ffbe)}
.wp-forest{background:linear-gradient(135deg,#78ffa0,#00a06e 55%,#beff5a)}
.wp-crimson{background:linear-gradient(135deg,#ff463c,#a00028 55%,#ff7828)}
.wp-mono{background:linear-gradient(135deg,#c8c8dc,#3c3c4c)}
.wp-custom{background:linear-gradient(135deg,#4a4a58,#22222c);font-size:19px}
</style>
</head>
<body>
<div class="wallpaper"></div>
<div id="app">
  <header class="top" id="topbar"></header>
  <main id="view"></main>
</div>
<button id="fab" title="Quick add">+</button>
<nav class="bottom" id="bottomnav"></nav>
<div id="sheetroot"></div>
<div id="toastroot"></div>
<script>
'use strict';
/* ============ GhostBlade Task — modular single-file app ============
   Sections: store / dates / nlp parser / recurrence / filters /
   reminders bridge / views / sheets. New features plug in as new
   sections + a menu entry in Browse, same as the web version. */
const $=s=>document.querySelector(s);
const uid=()=> 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return dstr(new Date());}
function parseD(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);}
function fmtDay(s){const d=parseD(s);const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return days[d.getDay()]+' '+d.getDate()+' '+mon[d.getMonth()];}
function isOverdue(t){return t.dueDate && t.dueDate<todayStr();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- store ---------- */
const KEY='gbt_state_v1';
let S=null;
function blankState(){return{tasks:[],projects:[],labels:[],filters:[],completions:[],activities:[],backups:[],seeded:false,lastBackupDay:''};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){S=JSON.parse(raw); return;}}catch(e){}
  S=blankState(); seed(); save();
}
function projByName(name){
  let p=S.projects.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(!p){p={id:uid(),name:name,color:'#d9a441'};S.projects.push(p);}
  return p;
}
function labelByName(name){
  let l=S.labels.find(l=>l.name.toLowerCase()===name.toLowerCase());
  if(!l){l={id:uid(),name:name};S.labels.push(l);}
  return l;
}
function seed(){
  if(S.seeded) return; S.seeded=true;
  const must=projByName('Must');
  const defs=['10 minutes Deep Breath 🫁 Meditation Must','10 minutes Workout Must','Writing 1 YouTube Script Must','Make at least One Ai Video'];
  defs.forEach((t,i)=>S.tasks.push({id:uid()+i,title:t,notes:'',projectId:must.id,labelIds:[],priority:1,dueDate:todayStr(),dueTime:null,recurrence:'daily',durationMin:null,reminderOffsetMin:null,subtasks:[],createdAt:Date.now()}));
  const starters=[['Priority 1','p1'],['Overdue','overdue'],['No due date','no date'],['Today & Priority 1','today & p1']];
  starters.forEach(([n,q])=>S.filters.push({id:uid()+n,name:n,query:q}));
  logActivity('seed','GhostBlade Task ready');
}
function logActivity(type,text){S.activities.unshift({id:uid(),type:type,text:text,at:Date.now()}); if(S.activities.length>2000)S.activities.length=2000;}

/* ---------- natural-language quick-add parser ---------- */
const WEEKDAYS={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function nextWeekday(wd){const now=new Date();let add=(wd-now.getDay()+7)%7; if(add===0)add=7; const d=new Date(now); d.setDate(d.getDate()+add); return dstr(d);}
function parseQuickAdd(input){
  let text=' '+input.trim()+' ';
  const out={title:'',dueDate:null,dueTime:null,recurrence:null,projectName:null,labelNames:[],priority:4,durationMin:null};
  text=text.replace(/#([\p{L}\p{N}_-]+)/gu,(m,n)=>{out.projectName=n;return ' ';});
  text=text.replace(/@([\p{L}\p{N}_-]+)/gu,(m,n)=>{out.labelNames.push(n);return ' ';});
  text=text.replace(/\bp([1-4])\b/i,(m,n)=>{out.priority=Number(n);return ' ';});
  text=text.replace(/\bfor\s+(\d+)\s*h(?:ours?)?\s*(?:(\d+)\s*m(?:in(?:ute)?s?)?)?\b/i,(m,h,mi)=>{out.durationMin=Number(h)*60+(mi?Number(mi):0);return ' ';});
  text=text.replace(/\bfor\s+(\d+)\s*m(?:in(?:ute)?s?)?\b/i,(m,mi)=>{out.durationMin=Number(mi);return ' ';});
  text=text.replace(/\b(\d+)\s*h\s*(\d+)\s*m\b/i,(m,h,mi)=>{out.durationMin=Number(h)*60+Number(mi);return ' ';});
  const low=text.toLowerCase();
  let m=low.match(/\bevery\s+(day|daily)\b/); if(m){out.recurrence='daily'; text=text.replace(/every\s+(day|daily)/i,' ');}
  else if((m=low.match(/\bevery\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/))){out.recurrence='weekly:'+WEEKDAYS[m[1]]; out.dueDate=nextWeekday(WEEKDAYS[m[1]]); text=text.replace(/every\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)/i,' '); text=text.replace(/\b(tomorrow|today)\b/i,' ');}
  else if(/\bevery\s+week\b/.test(low)){out.recurrence='weekly'; text=text.replace(/every\s+week/i,' ');}
  else if(/\bevery\s+month\b/.test(low)){out.recurrence='monthly'; text=text.replace(/every\s+month/i,' ');}
  if(!out.dueDate){
    if(/\btomorrow\b/i.test(text)){out.dueDate=addDays(todayStr(),1); text=text.replace(/tomorrow/i,' ');}
    else if(/\btoday\b/i.test(text)){out.dueDate=todayStr(); text=text.replace(/today/i,' ');}
    else if(/\bnext week\b/i.test(text)){out.dueDate=addDays(todayStr(),7); text=text.replace(/next week/i,' ');}
    else if((m=text.toLowerCase().match(/\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/))){out.dueDate=nextWeekday(WEEKDAYS[m[1]]); text=text.replace(new RegExp(m[1],'i'),' ');}
    else if((m=text.match(/\b(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)(?:[a-z]*)\b/i))){const now=new Date();let d=new Date(now.getFullYear(),MONTHS[m[2].toLowerCase()],Number(m[1])); if(dstr(d)<todayStr())d.setFullYear(d.getFullYear()+1); out.dueDate=dstr(d); text=text.replace(m[0],' ');}
    else if((m=text.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)(?:[a-z]*)\s+(\d{1,2})\b/i))){const now=new Date();let d=new Date(now.getFullYear(),MONTHS[m[1].toLowerCase()],Number(m[2])); if(dstr(d)<todayStr())d.setFullYear(d.getFullYear()+1); out.dueDate=dstr(d); text=text.replace(m[0],' ');}
  }
  if((m=text.match(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i))){
    let h=Number(m[1])%12; if(m[3].toLowerCase()==='pm')h+=12;
    out.dueTime=pad(h)+':'+(m[2]||'00'); text=text.replace(m[0],' ');
  } else if((m=text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/))){out.dueTime=pad(Number(m[1]))+':'+m[2]; text=text.replace(m[0],' ');}
  out.title=text.replace(/\s+/g,' ').trim();
  return out;
}
function describeParse(p){
  const chips=[];
  if(p.dueDate)chips.push('📅 '+(p.dueDate===todayStr()?'Today':p.dueDate===addDays(todayStr(),1)?'Tomorrow':fmtDay(p.dueDate)));
  if(p.dueTime)chips.push('🕐 '+p.dueTime);
  if(p.recurrence)chips.push('🔁 '+p.recurrence.replace('weekly:','weekly · '));
  if(p.projectName)chips.push('#'+p.projectName);
  p.labelNames.forEach(l=>chips.push('@'+l));
  if(p.priority<4)chips.push('P'+p.priority);
  if(p.durationMin)chips.push('⏱ '+p.durationMin+'m');
  return chips;
}

/* ---------- recurrence ---------- */
function advanceDate(task){
  const d=task.dueDate||todayStr(); const r=task.recurrence;
  if(r==='daily')return addDays(d,1);
  if(r==='weekly')return addDays(d,7);
  if(r==='monthly'){const dt=parseD(d); dt.setMonth(dt.getMonth()+1); return dstr(dt);}
  if(r&&r.indexOf('weekly:')===0){const wd=Number(r.split(':')[1]); let nd=addDays(d,1); while(parseD(nd).getDay()!==wd)nd=addDays(nd,1); return nd;}
  return d;
}

/* ---------- filters ---------- */
function matchToken(t,tok){
  tok=tok.trim().toLowerCase(); if(!tok)return true;
  if(tok==='today')return t.dueDate===todayStr();
  if(tok==='overdue')return isOverdue(t);
  if(tok==='upcoming')return t.dueDate&&t.dueDate>todayStr();
  if(tok==='no date')return !t.dueDate;
  if(tok==='recurring')return !!t.recurrence;
  if(/^p[1-4]$/.test(tok))return t.priority===Number(tok[1]);
  if(tok[0]==='#'){const p=S.projects.find(p=>p.id===t.projectId); return p&&p.name.toLowerCase()===tok.slice(1);}
  if(tok[0]==='@'){return t.labelIds.some(id=>{const l=S.labels.find(l=>l.id===id); return l&&l.name.toLowerCase()===tok.slice(1);});}
  return t.title.toLowerCase().indexOf(tok)>=0;
}
function evalFilter(t,q){
  return q.split('|').some(group=>group.split('&').every(tok=>matchToken(t,tok)));
}

<script>
/* ---------- reminders bridge (native alarms in the APK) ---------- */
const Bridge=(typeof AndroidBridge!=='undefined')?AndroidBridge:null;
function reminderTrigger(t){
  if(t.reminderOffsetMin==null||!t.dueDate)return null;
  const base=parseD(t.dueDate);
  const[hh,mm]=(t.dueTime||'09:00').split(':').map(Number);
  base.setHours(hh,mm,0,0);
  return base.getTime()-t.reminderOffsetMin*60000;
}
function syncReminder(t){
  if(!Bridge)return;
  const at=reminderTrigger(t);
  if(at&&at>Date.now())Bridge.scheduleReminder('rem_'+t.id,t.title,at);
  else Bridge.cancelReminder('rem_'+t.id);
}
function dropReminder(t){if(Bridge)Bridge.cancelReminder('rem_'+t.id);}

/* ---------- task actions ---------- */
function addTaskFromParse(p,base){
  const t={id:uid(),title:p.title||'Untitled task',notes:'',projectId:null,labelIds:[],priority:p.priority||4,
    dueDate:p.dueDate||null,dueTime:p.dueTime||null,recurrence:p.recurrence||null,durationMin:p.durationMin||null,
    reminderOffsetMin:null,subtasks:[],createdAt:Date.now()};
  if(base)Object.assign(t,base);
  if(p.projectName)t.projectId=projByName(p.projectName).id;
  (p.labelNames||[]).forEach(n=>t.labelIds.push(labelByName(n).id));
  S.tasks.push(t); logActivity('create','Added "'+t.title+'"');
  syncReminder(t); save(); return t;
}
function completeTask(id){
  const i=S.tasks.findIndex(t=>t.id===id); if(i<0)return;
  const t=S.tasks[i];
  S.completions.unshift({id:uid(),taskId:id,title:t.title,projectId:t.projectId||null,date:todayStr(),at:Date.now()});
  logActivity('complete','Completed "'+t.title+'"');
  if(t.recurrence){
    t.dueDate=advanceDate(t);
    syncReminder(t);
    toast('Done ✅ Next: '+fmtDay(t.dueDate));
  } else {
    dropReminder(t);
    S.tasks.splice(i,1);
    toast('Done ✅');
  }
  save(); render();
}
function deleteTask(id){
  const i=S.tasks.findIndex(t=>t.id===id); if(i<0)return;
  dropReminder(S.tasks[i]);
  logActivity('delete','Deleted "'+S.tasks[i].title+'"');
  S.tasks.splice(i,1); save();
}
function completionsOn(date){return S.completions.filter(c=>c.date===date).length;}
function currentStreak(){
  let streak=0; let d=todayStr();
  if(completionsOn(d)===0)d=addDays(d,-1);
  while(completionsOn(d)>0){streak++; d=addDays(d,-1);}
  return streak;
}
function autoBackup(){
  const day=todayStr(); if(S.lastBackupDay===day)return;
  S.lastBackupDay=day;
  S.backups.unshift({id:uid(),at:Date.now(),auto:true,data:snapshot()});
  S.backups=S.backups.slice(0,10);
}
function snapshot(){return JSON.stringify({tasks:S.tasks,projects:S.projects,labels:S.labels,filters:S.filters,completions:S.completions,activities:S.activities,seeded:true});}

/* ---------- rendering ---------- */
let view='today'; let sub=null; let calCursor=null; let calSel=null; let filterSel=null;
const TITLES={today:'Today',inbox:'Inbox',upcoming:'Upcoming',browse:'Browse'};
function projName(t){const p=S.projects.find(p=>p.id===t.projectId);return p?p.name:null;}
function metaHtml(t){
  const bits=[];
  if(t.dueDate){const lbl=t.dueDate===todayStr()?'Today':t.dueDate===addDays(todayStr(),1)?'Tomorrow':fmtDay(t.dueDate);
    bits.push('<span class="'+(isOverdue(t)?'over':'due')+'">📅 '+lbl+(t.dueTime?' · '+t.dueTime:'')+'</span>');}
  if(t.recurrence)bits.push('<span>🔁 '+esc(t.recurrence)+'</span>');
  if(t.durationMin)bits.push('<span>⏱ '+t.durationMin+'m</span>');
  if(t.reminderOffsetMin!=null)bits.push('<span>⏰ reminder</span>');
  const pn=projName(t); if(pn)bits.push('<span class="proj">#'+esc(pn)+'</span>');
  t.labelIds.forEach(id=>{const l=S.labels.find(l=>l.id===id); if(l)bits.push('<span>@'+esc(l.name)+'</span>');});
  const doneSubs=t.subtasks.filter(s=>s.done).length;
  if(t.subtasks.length)bits.push('<span>☑ '+doneSubs+'/'+t.subtasks.length+'</span>');
  if(t.priority<4)bits.push('<span style="color:var(--red)">P'+t.priority+'</span>');
  return bits.length?'<div class="meta">'+bits.join('')+'</div>':'';
}
function taskRow(t){
  return '<div class="task"><button class="check p'+t.priority+'" data-act="complete" data-id="'+t.id+'" aria-label="Complete"></button>'+
    '<div class="body" data-act="edit" data-id="'+t.id+'"><div class="title">'+esc(t.title)+'</div>'+metaHtml(t)+'</div></div>';
}
function sortTasks(list){
  return list.slice().sort((a,b)=>{
    const da=a.dueDate||'9999', db=b.dueDate||'9999';
    if(da!==db)return da<db?-1:1;
    if(a.priority!==b.priority)return a.priority-b.priority;
    return a.createdAt-b.createdAt;});
}
function renderTop(){
  const el=$('#topbar');
  if(sub){el.innerHTML='<h1>'+esc(subTitle())+'</h1><div class="sub"><a href="#" data-act="back" style="color:var(--red);text-decoration:none">‹ Back</a></div>'; return;}
  if(view==='today'){
    const total=S.tasks.filter(t=>t.dueDate===todayStr()||isOverdue(t)).length;
    const done=completionsOn(todayStr());
    const denom=total+done; const pct=denom?Math.round(done/denom*100):0;
    const planned=S.tasks.filter(t=>t.dueDate===todayStr()).reduce((a,t)=>a+(t.durationMin||0),0);
    el.innerHTML='<h1>Today</h1><div class="sub">'+fmtDay(todayStr())+' · <b>'+done+' done</b> · '+total+' to go'+(planned?' · ⏱ '+planned+'m planned':'')+' · 🔥 '+currentStreak()+' day streak</div><div class="prog"><i style="width:'+pct+'%"></i></div>';
    return;
  }
  el.innerHTML='<h1>'+TITLES[view]+'</h1><div class="sub">'+headerSub()+'</div>';
}
function headerSub(){
  if(view==='inbox')return S.tasks.filter(t=>!t.projectId).length+' tasks with no project';
  if(view==='upcoming')return S.tasks.filter(t=>t.dueDate&&t.dueDate>todayStr()).length+' future tasks';
  return S.projects.length+' projects · '+S.tasks.length+' open tasks';
}
function subTitle(){
  const map={calendar:'Calendar',ramble:'Ramble',assist:'Task & Email Assist',history:'History',insights:'Project Insights',backups:'Backups',stats:'Productivity'};
  if(sub&&sub.indexOf('filter:')===0){const f=S.filters.find(f=>f.id===sub.slice(7)); return f?('Filter · '+f.name):'Filter';}
  if(sub&&sub.indexOf('project:')===0){const p=S.projects.find(p=>p.id===sub.slice(8)); return p?('# '+p.name):'Project';}
  return map[sub]||'GhostBlade Task';
}
let lastTab='today';
function render(){
  renderTop();
  const el=$('#view');
  let html='';
  if(sub)html=renderSub();
  else if(view==='today'){
    const list=sortTasks(S.tasks.filter(t=>t.dueDate===todayStr()||isOverdue(t)));
    html=list.length?list.map(taskRow).join(''):'<div class="empty"><span class="big">🎉</span>All clear for today.<br>Tap + to add a task — try "Gym tomorrow at 7am every day".</div>';
  }
  else if(view==='inbox'){
    const list=sortTasks(S.tasks.filter(t=>!t.projectId));
    html=list.length?list.map(taskRow).join(''):'<div class="empty"><span class="big">📥</span>Inbox is empty.</div>';
  }
  else if(view==='upcoming'){
    const fut=sortTasks(S.tasks.filter(t=>t.dueDate&&t.dueDate>todayStr()));
    if(!fut.length)html='<div class="empty"><span class="big">🗓️</span>Nothing coming up yet.</div>';
    else{let last=''; fut.forEach(t=>{if(t.dueDate!==last){last=t.dueDate; html+='<div class="daygroup">'+fmtDay(last)+(last===addDays(todayStr(),1)?' · <span class="today-lbl">Tomorrow</span>':'')+'</div>';} html+=taskRow(t);});}
  }
  else if(view==='browse')html=renderBrowse();
  el.innerHTML=html;
  el.querySelectorAll('.task,.menuitem,.card').forEach((n,i)=>n.style.setProperty('--i',Math.min(i,14)));
  const order=['inbox','today','upcoming','browse']; let cls='vin-up';
  if(!sub&&view!==lastTab&&order.includes(view)&&order.includes(lastTab)) cls=order.indexOf(view)>order.indexOf(lastTab)?'vin-r':'vin-l';
  if(!sub&&order.includes(view)) lastTab=view;
  el.classList.remove('vin-r','vin-l','vin-up'); void el.offsetWidth; el.classList.add(cls);
  renderNav();
}
function renderNav(){
  const items=[['inbox','📥','Inbox'],['today','📅','Today'],['upcoming','🗓️','Upcoming'],['browse','🔍','Browse']];
  $('#bottomnav').innerHTML=items.map(([v,ic,l])=>'<button data-act="nav" data-v="'+v+'" class="'+(!sub&&view===v?'on':'')+'"><span class="ic">'+ic+'</span>'+l+'</button>').join('');
}
function applyWallpaper(){
  const w=localStorage.getItem('gbt_wallpaper')||'aurora';
  document.body.dataset.wallpaper=w;
  const el=document.querySelector('.wallpaper'); if(!el)return;
  if(w==='custom'){
    const img=localStorage.getItem('gbt_wallpaper_img');
    el.style.backgroundImage=img?('url("'+img+'")'):'';
    el.style.backgroundSize='cover'; el.style.backgroundPosition='center';
  } else { el.style.backgroundImage=''; el.style.backgroundSize=''; el.style.backgroundPosition=''; }
}

  let h='<div class="daygroup">PROJECTS</div>';
  if(!S.projects.length)h+='<div class="empty">No projects yet — add one with #Name in Quick Add.</div>';

    const n=S.tasks.filter(t=>t.projectId===p.id).length;
    h+='<button class="menuitem" data-act="openproject" data-id="'+p.id+'"><span class="ic">📁</span><span>'+esc(p.name)+'<small>'+n+' open tasks</small></span></button>';
  });

  pro.forEach(([k,ic,n,d])=>{h+='<button class="menuitem" data-act="opensub" data-v="'+k+'"><span class="ic">'+ic+'</span><span>'+n+'<small>'+d+'</small></span><span class="tag">PRO</span></button>';});
  const gv=localStorage.getItem('gbt_glass')||'default';

    +'<label class="lbl" style="margin-top:13px">Sound effects</label><div class="chips" style="margin:0"><button class="chip'+(sfxOn?' on':'')+'" data-act="sfx" data-v="on">🔊 On</button><button class="chip'+(!sfxOn?' on':'')+'" data-act="sfx" data-v="off">🔇 Off</button></div>'
    +'<label class="lbl" style="margin-top:13px">Background wallpaper</label><div class="wp-row">'
    +[['aurora','Aurora'],['sunset','Sunset'],['ocean','Ocean'],['forest','Forest'],['crimson','Crimson'],['mono','Mono']].map(([v,l])=>'<button class="wp-swatch wp-'+v+(wp===v?' on':'')+'" data-act="wp" data-v="'+v+'" title="'+l+'" aria-label="'+l+'"></button>').join('')
    +(hasWpImg?'<button class="wp-swatch wp-custom'+(wp==='custom'?' on':'')+'" data-act="wp" data-v="custom" title="Your photo" aria-label="Your photo">🖼️</button>':'')
    +'</div><div class="row2"><button class="btn ghost small" data-act="wp-upload">🖼️ Upload photo</button>'
    +(hasWpImg?'<button class="btn ghost small" data-act="wp-remove">Remove photo</button>':'')+'</div>'
    +'<input type="file" id="wpFile" accept="image/*" style="display:none"></div>';
  h+='<div class="card"><h4>GhostBlade Task</h4><div class="muted">Android edition · data lives on this device · reminders fire even when the app is closed and survive reboot.</div></div>';
  return h;
}

<script>
/* ---------- sub views (Pro modules) ---------- */
function renderSub(){
  if(sub.indexOf('filter:')===0){
    const f=S.filters.find(f=>f.id===sub.slice(7)); if(!f)return '<div class="empty">Filter not found.</div>';
    const list=sortTasks(S.tasks.filter(t=>evalFilter(t,f.query)));
    return (list.length?list.map(taskRow).join(''):'<div class="empty"><span class="big">🔎</span>No tasks match "'+esc(f.query)+'".</div>')
      +'<button class="btn danger" data-act="delfilter" data-id="'+f.id+'">Delete this filter</button>';
  }
  if(sub.indexOf('project:')===0){
    const p=S.projects.find(p=>p.id===sub.slice(8)); if(!p)return '<div class="empty">Project not found.</div>';
    const list=sortTasks(S.tasks.filter(t=>t.projectId===p.id));
    return (list.length?list.map(taskRow).join(''):'<div class="empty"><span class="big">📁</span>No open tasks in this project.</div>')
      +'<button class="btn ghost" data-act="opensub" data-v="insights">View project insights</button>';
  }
  switch(sub){
    case 'stats': return viewStats();
    case 'calendar': return viewCalendar();
    case 'insights': return viewInsights();
    case 'history': return viewHistory();
    case 'ramble': return viewRamble();
    case 'assist': return viewAssist();
    case 'backups': return viewBackups();
  }
  return '';
}
function last7(){
  const out=[]; for(let i=6;i>=0;i--){const d=addDays(todayStr(),-i); out.push({date:d,n:completionsOn(d)});}
  return out;
}
function viewStats(){
  const doneToday=completionsOn(todayStr());
  const todayTotal=doneToday+S.tasks.filter(t=>t.dueDate===todayStr()||isOverdue(t)).length;
  const pct=todayTotal?Math.round(doneToday/todayTotal*100):0;
  const circ=2*Math.PI*40;
  const days=last7(); const max=Math.max(1,...days.map(d=>d.n));
  const bars=days.map(d=>'<div class="bar"><i style="height:'+Math.round(d.n/max*100)+'%"></i></div>').join('');
  const lbls=days.map(d=>'<span>'+'SMTWTFS'[parseD(d.date).getDay()]+'</span>').join('');
  const planned=S.tasks.filter(t=>t.dueDate===todayStr()).reduce((a,t)=>a+(t.durationMin||0),0);
  return '<div class="card"><div class="ring-wrap"><svg class="ring" viewBox="0 0 92 92"><circle class="bgc" cx="46" cy="46" r="40"></circle><circle class="fgc" cx="46" cy="46" r="40" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-pct/100))+'"></circle><text x="46" y="52">'+pct+'%</text></svg><div><h4 style="margin:0 0 4px">Today</h4><div class="muted">'+doneToday+' of '+todayTotal+' done<br>⏱ '+planned+'m planned<br>🔥 '+currentStreak()+' day streak</div></div></div></div>'
    +'<div class="card"><h4>Last 7 days</h4><div class="bars">'+bars+'</div><div class="bars-lbl">'+lbls+'</div></div>'
    +'<div class="kpi"><div class="card"><div class="num">'+S.completions.length+'</div><div class="cap">All-time completions</div></div><div class="card"><div class="num">'+S.tasks.length+'</div><div class="cap">Open tasks</div></div><div class="card"><div class="num">'+S.projects.length+'</div><div class="cap">Projects</div></div></div>';
}
function viewCalendar(){
  if(!calCursor)calCursor=todayStr().slice(0,8)+'01';
  const cur=parseD(calCursor); const year=cur.getFullYear(), mon=cur.getMonth();
  const first=new Date(year,mon,1); const startDay=first.getDay();
  const daysIn=new Date(year,mon+1,0).getDate();
  const monNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  let h='<div class="row2"><button class="btn ghost small" data-act="calprev">‹ Prev</button><button class="btn ghost small" data-act="calnext">Next ›</button></div>';
  h+='<h3 style="text-align:center;margin:10px 0 2px">'+monNames[mon]+' '+year+'</h3><div class="cal">';
  ['S','M','T','W','T','F','S'].forEach(d=>h+='<div class="dow">'+d+'</div>');
  for(let i=0;i<startDay;i++)h+='<div></div>';
  for(let d=1;d<=daysIn;d++){
    const ds=dstr(new Date(year,mon,d));
    const n=S.tasks.filter(t=>t.dueDate===ds).length;
    h+='<div class="day cur'+(ds===todayStr()?' today':'')+'" data-act="calday" data-d="'+ds+'"><span class="n">'+d+'</span>'+(n?'<span class="cnt">'+n+'</span>':'')+'</div>';
  }
  h+='</div>';
  if(calSel){
    const list=sortTasks(S.tasks.filter(t=>t.dueDate===calSel));
    h+='<div class="daygroup">'+fmtDay(calSel)+'</div>'+(list.length?list.map(taskRow).join(''):'<div class="empty">No tasks this day.</div>')
      +'<button class="btn red" data-act="addonday" data-d="'+calSel+'">+ Add task on this day</button>';
  } else h+='<div class="empty">Tap a day to see its tasks.</div>';
  return h;
}
function viewInsights(){
  if(!S.projects.length)return '<div class="empty">No projects yet.</div>';
  return S.projects.map(p=>{
    const open=S.tasks.filter(t=>t.projectId===p.id);
    const over=open.filter(isOverdue).length;
    const planned=open.reduce((a,t)=>a+(t.durationMin||0),0);
    const doneP=S.completions.filter(c=>c.projectId===p.id).length;
    const total=open.length+doneP; const pct=total?Math.round(doneP/total*100):0;
    let best='—',bestN=0; const byDay={};
    S.completions.filter(c=>c.projectId===p.id).forEach(c=>{const wd='SMTWTFS'[parseD(c.date).getDay()]; byDay[wd]=(byDay[wd]||0)+1; if(byDay[wd]>bestN){bestN=byDay[wd]; best=wd;}});
    return '<div class="card"><h4># '+esc(p.name)+'</h4><div class="prog"><i style="width:'+pct+'%"></i></div><div class="muted" style="margin-top:8px">'+doneP+' done · '+open.length+' open · '+pct+'% complete<br>Overdue: '+over+' · Planned time open: '+planned+'m<br>Most productive day: '+best+'</div></div>';
  }).join('');
}
function viewHistory(){
  const days=[]; for(let i=0;i<30;i++){const d=addDays(todayStr(),-i); days.push({date:d,n:completionsOn(d)});}
  const max=Math.max(1,...days.map(d=>d.n));
  const bars=days.slice().reverse().map(d=>'<div class="bar"><i style="height:'+Math.round(d.n/max*100)+'%"></i></div>').join('');
  const best=days.reduce((a,d)=>d.n>a.n?d:a,{n:0,date:'—'});
  let h='<div class="card"><h4>Completions — last 30 days</h4><div class="bars">'+bars+'</div><div class="muted" style="margin-top:6px">Best day: '+(best.date==='—'?'—':fmtDay(best.date))+' ('+best.n+') · All-time: '+S.completions.length+'</div></div>';
  h+='<div class="daygroup">ACTIVITY</div>';
  h+=S.activities.slice(0,120).map(a=>'<div class="task"><div class="body"><div class="title" style="font-size:14px">'+esc(a.text)+'</div><div class="meta"><span>'+new Date(a.at).toLocaleString()+'</span></div></div></div>').join('')||'<div class="empty">No activity yet.</div>';
  return h;
}
function viewRamble(){
  return '<div class="card"><h4>🎙️ Ramble — unlimited sessions</h4><div class="muted">Speak or type your tasks, one per line. Dates, projects, priorities and durations are understood — e.g. "Call mom tomorrow at 5pm p2".</div></div>'
    +'<textarea id="rambleText" placeholder="Buy milk tomorrow #Groceries&#10;Gym every friday for 45m&#10;Write script today p1"></textarea>'
    +'<div class="row2"><button class="btn ghost" data-act="ramble-mic">🎙️ Voice</button><button class="btn red" data-act="ramble-add" style="width:auto;flex:1">Add all as tasks</button></div>'
    +'<div id="rambleOut"></div>';
}
function viewAssist(){
  return '<div class="card"><h4>🤖 Task & Email Assist</h4><div class="muted">Paste an email or any text — action lines become tasks. Or open any task → "Break it down" to auto-create subtasks.</div></div>'
    +'<textarea id="assistText" placeholder="Paste email or text here…"></textarea>'
    +'<button class="btn red" data-act="assist-extract">Extract tasks</button><div id="assistOut" style="margin-top:10px"></div>';
}
function viewBackups(){
  const last=S.backups[0]?new Date(S.backups[0].at).toLocaleString():'never';
  let h='<div class="card"><h4>💾 Backups</h4><div class="muted">Automatic snapshot once a day (last 10 kept). Last backup: '+last+'</div></div>'
    +'<button class="btn red" data-act="backup-now">Back up now</button>'
    +'<div class="daygroup">SNAPSHOTS</div>'
    +(S.backups.map(b=>'<button class="menuitem" data-act="restore" data-id="'+b.id+'"><span class="ic">🗂️</span><span>'+new Date(b.at).toLocaleString()+'<small>'+(b.auto?'Automatic':'Manual')+' — tap to restore</small></span></button>').join('')||'<div class="empty">No snapshots yet.</div>')
    +'<div class="daygroup">EXPORT / IMPORT</div><textarea id="ioText" placeholder="Exported JSON appears here. Paste JSON here to import."></textarea>'
    +'<div class="row2"><button class="btn ghost" data-act="export">Export JSON</button><button class="btn ghost" data-act="import">Import JSON</button></div>';
  return h;
}

/* ---------- sheets ---------- */
function openSheet(html){
  $('#sheetroot').innerHTML='<div class="sheet-bg" data-act="closesheet"></div><div class="sheet">'+html+'</div>';
  /* swipe-down on the grab handle dismisses the sheet, iOS-style */
  const sh=$('#sheetroot .sheet'); let sy=null,dy=0;
  sh.addEventListener('pointerdown',e=>{const r=sh.getBoundingClientRect(); if(e.clientY-r.top<30&&sh.scrollTop<=0){sy=e.clientY; dy=0; sh.classList.add('dragging'); try{sh.setPointerCapture(e.pointerId);}catch(_){}}});
  sh.addEventListener('pointermove',e=>{if(sy===null)return; dy=Math.max(0,e.clientY-sy); sh.style.transform='translateY('+dy+'px)';});
  const end=()=>{if(sy===null)return; sh.classList.remove('dragging'); sh.style.transform=''; if(dy>90)closeSheet(); sy=null; dy=0;};
  sh.addEventListener('pointerup',end); sh.addEventListener('pointercancel',end);
  SFX.open();
}
function closeSheet(){
  const root=$('#sheetroot'); const sh=root.querySelector('.sheet');
  if(!sh){root.innerHTML=''; return;}
  const bg=root.querySelector('.sheet-bg');
  sh.classList.add('closing'); if(bg)bg.classList.add('closing');
  SFX.close();
  setTimeout(()=>{if(root.contains(sh))root.innerHTML='';},235);
}
function toast(msg){
  $('#toastroot').innerHTML='<div class="toast">'+esc(msg)+'</div>';
  setTimeout(()=>{$('#toastroot').innerHTML='';},2200);
}
function openQuickAdd(presetDate){
  openSheet('<h3>Quick Add</h3><input type="text" id="qaText" placeholder="e.g. Gym tomorrow at 7am every day #Health p2 for 45m" autocomplete="off"><div class="chips" id="qaChips"></div><button class="btn red" data-act="qa-add">Add task</button>');
  const inp=$('#qaText'); inp.focus();
  if(presetDate){inp.value=''; inp.dataset.date=presetDate;}
  inp.addEventListener('input',()=>{
    const p=parseQuickAdd(inp.value);
    $('#qaChips').innerHTML=describeParse(p).map(c=>'<span class="chip">'+esc(c)+'</span>').join('');
  });
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitQuickAdd();});
}
function submitQuickAdd(){
  const inp=$('#qaText'); const raw=inp.value.trim(); if(!raw)return;
  const p=parseQuickAdd(raw);
  if(!p.title){toast('Add a title too'); return;}
  const base={}; if(inp.dataset.date&&!p.dueDate)base.dueDate=inp.dataset.date;
  addTaskFromParse(p,base);
  SFX.add(); closeSheet(); render(); toast('Task added ✅');
}
let editingId=null;
function openEditor(id){
  const t=S.tasks.find(t=>t.id===id); if(!t)return; editingId=id;
  const projOpts='<option value="">Inbox (no project)</option>'+S.projects.map(p=>'<option value="'+p.id+'"'+(t.projectId===p.id?' selected':'')+'>'+esc(p.name)+'</option>').join('');
  const recOpts=[['','No repeat'],['daily','Every day'],['weekly','Every week'],['monthly','Every month']].concat([0,1,2,3,4,5,6].map(d=>['weekly:'+d,'Every '+'SMTWTFS'[d]+' '+'Sunday Monday Tuesday Wednesday Thursday Friday Saturday'.split(' ')[d]])).map(([v,l])=>'<option value="'+v+'"'+(t.recurrence===v?' selected':'')+'>'+l+'</option>').join('');
  const remOpts=[[null,'No reminder'],[0,'At due time'],[10,'10 min before'],[30,'30 min before'],[60,'1 hour before'],[1440,'1 day before']].map(([v,l])=>'<option value="'+(v===null?'':v)+'"'+(t.reminderOffsetMin===v?' selected':'')+'>'+l+'</option>').join('');
  const subs=t.subtasks.map(s=>'<div class="subtask'+(s.done?' done':'')+'"><button class="box" data-act="togglesub" data-id="'+s.id+'"></button><span class="t" style="flex:1">'+esc(s.title)+'</span><button class="btn ghost small" data-act="delsub" data-id="'+s.id+'">✕</button></div>').join('');
  openSheet('<h3>Edit task</h3>'
    +'<label class="lbl">Title</label><input type="text" id="edTitle" value="'+esc(t.title)+'">'
    +'<label class="lbl">Notes</label><textarea id="edNotes" placeholder="Notes">'+esc(t.notes||'')+'</textarea>'
    +'<div class="row2"><div><label class="lbl">Due date</label><input type="date" id="edDate" value="'+(t.dueDate||'')+'"></div><div><label class="lbl">Time</label><input type="time" id="edTime" value="'+(t.dueTime||'')+'"></div></div>'
    +'<div class="row2"><div><label class="lbl">Repeat</label><select id="edRec">'+recOpts+'</select></div><div><label class="lbl">Priority</label><select id="edPri">'+[1,2,3,4].map(n=>'<option value="'+n+'"'+(t.priority===n?' selected':'')+'>P'+n+(n===1?' — highest':'')+'</option>').join('')+'</select></div></div>'
    +'<div class="row2"><div><label class="lbl">Project</label><select id="edProj">'+projOpts+'</select></div><div><label class="lbl">Duration (minutes)</label><input type="number" id="edDur" min="0" placeholder="e.g. 30" value="'+(t.durationMin||'')+'"></div></div>'
    +'<label class="lbl">Reminder (fires even if app is closed)</label><select id="edRem">'+remOpts+'</select>'
    +'<div class="daygroup">SUBTASKS</div><div id="subList">'+subs+'</div>'
    +'<div class="row2"><input type="text" id="subText" placeholder="Add a subtask"><button class="btn ghost small" data-act="addsub" style="flex:0 0 auto">Add</button></div>'
    +'<button class="btn ghost" data-act="breakdown" style="margin:8px 0">🤖 Break it down (auto subtasks)</button>'
    +'<button class="btn red" data-act="ed-save">Save</button>'
    +'<button class="btn danger" data-act="ed-delete">Delete task</button>');
}
function saveEditor(){
  const t=S.tasks.find(t=>t.id===editingId); if(!t)return;
  dropReminder(t);
  t.title=$('#edTitle').value.trim()||t.title;
  t.notes=$('#edNotes').value;
  t.dueDate=$('#edDate').value||null;
  t.dueTime=$('#edTime').value||null;
  t.recurrence=$('#edRec').value||null;
  t.priority=Number($('#edPri').value);
  t.projectId=$('#edProj').value||null;
  const d=Number($('#edDur').value); t.durationMin=d>0?d:null;
  const r=$('#edRem').value; t.reminderOffsetMin=(r===''?null:Number(r));
  syncReminder(t); save(); SFX.tick(); closeSheet(); render(); toast('Saved ✅');
}
/* assist breakdown templates */
function breakdownFor(title){
  const t=title.toLowerCase();
  const generic=['Research & gather what you need','Plan the steps','Do the first small step','Review & fix','Finish & wrap up'];
  if(/video|reel|short/.test(t))return['Write the script','Record / generate the footage','Edit the video','Add captions & thumbnail','Upload & schedule'];
  if(/script|write|blog|essay/.test(t))return['Outline the main points','Write a rough first draft','Edit for clarity','Proofread','Publish / submit'];
  if(/study|exam|learn|read|chapter/.test(t))return['Skim the material first','Study in 25-minute focus blocks','Write summary notes','Self-test / practice questions','Review weak spots'];
  if(/buy|shop|order/.test(t))return['Make the list','Compare prices','Place the order','Check delivery'];
  if(/clean|room|organize/.test(t))return['Clear the clutter','Clean surfaces','Organize what remains','Take out the trash'];
  if(/project|build|app|code/.test(t))return['Define the scope','Set up the project','Build the core feature','Test it','Ship / share it'];
  return generic;
}

<script>
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case 'nav': SFX.nav(); view=el.dataset.v; sub=null; render(); break;
    case 'glass': localStorage.setItem('gbt_glass',el.dataset.v); document.body.dataset.glass=el.dataset.v; render(); break;
    case 'wp': localStorage.setItem('gbt_wallpaper',el.dataset.v); applyWallpaper(); render(); break;
    case 'wp-upload': { const f=$('#wpFile'); if(f)f.click(); break; }
    case 'wp-remove': localStorage.removeItem('gbt_wallpaper_img'); if(localStorage.getItem('gbt_wallpaper')==='custom')localStorage.setItem('gbt_wallpaper','aurora'); applyWallpaper(); render(); toast('Photo removed'); break;
    case 'sfx': localStorage.setItem('gbt_sounds',el.dataset.v); if(el.dataset.v==='on')setTimeout(()=>SFX.add(),30); render(); break;
    case 'opensub': SFX.nav(); sub=el.dataset.v; render(); break;
    case 'back': SFX.nav(); sub=null; render(); break;
    case 'openproject': SFX.nav(); sub='project:'+id; render(); break;
    case 'openfilter': SFX.nav(); sub='filter:'+id; render(); break;
    case 'complete': { const row=el.closest('.task');
      if(row&&!row.classList.contains('completing')){row.classList.add('completing'); SFX.complete(); if(navigator.vibrate)navigator.vibrate(8); setTimeout(()=>completeTask(id),340);}
      else {SFX.complete(); completeTask(id);}
      break; }
    case 'edit': openEditor(id); break;
    case 'closesheet': closeSheet(); break;
    case 'qa-add': submitQuickAdd(); break;
    case 'ed-save': saveEditor(); break;
    case 'ed-delete': SFX.del(); deleteTask(editingId); closeSheet(); render(); break;
    case 'addsub': {
      const t=S.tasks.find(t=>t.id===editingId); const v=$('#subText').value.trim(); if(!t||!v)break;
      t.subtasks.push({id:uid(),title:v,done:false}); save(); openEditor(editingId); break;}
    case 'togglesub': {
      const t=S.tasks.find(t=>t.id===editingId); const s=t&&t.subtasks.find(s=>s.id===id); if(s){s.done=!s.done; SFX.tick(); save(); openEditor(editingId);} break;}
    case 'delsub': {
      const t=S.tasks.find(t=>t.id===editingId); if(t){t.subtasks=t.subtasks.filter(s=>s.id!==id); save(); openEditor(editingId);} break;}
    case 'breakdown': {
      const t=S.tasks.find(t=>t.id===editingId); if(!t)break;
      breakdownFor(t.title).forEach(x=>t.subtasks.push({id:uid(),title:x,done:false}));
      save(); openEditor(editingId); toast('Subtasks added 🤖'); break;}
    case 'newproject': {
      const name=prompt('Project name:'); if(name&&name.trim()){projByName(name.trim()); save(); render();} break;}
    case 'newfilter': {
      const name=prompt('Filter name:'); if(!name)break;
      const q=prompt('Filter query (e.g. "today & p1", "#Work", "@home", "overdue", "no date"):'); if(!q)break;
      S.filters.push({id:uid(),name:name.trim(),query:q.trim()}); save(); render(); break;}
    case 'delfilter': SFX.del(); S.filters=S.filters.filter(f=>f.id!==id); sub=null; save(); render(); break;
    case 'calprev': {const d=parseD(calCursor); d.setMonth(d.getMonth()-1); calCursor=dstr(d); render(); break;}
    case 'calnext': {const d=parseD(calCursor); d.setMonth(d.getMonth()+1); calCursor=dstr(d); render(); break;}
    case 'calday': calSel=el.dataset.d; render(); break;
    case 'addonday': openQuickAdd(el.dataset.d); break;
    case 'ramble-mic': {
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){toast('Voice not available here — type instead'); break;}
      try{const r=new SR(); r.lang='en-US'; r.interimResults=false;
        r.onresult=ev=>{const txt=ev.results[0][0].transcript; const ta=$('#rambleText'); ta.value=(ta.value?ta.value+'\n':'')+txt;};
        r.onerror=()=>toast('Voice failed — type instead');
        r.start(); toast('Listening… speak one task');}catch(err){toast('Voice not available — type instead');}
      break;}
    case 'ramble-add': {
      const lines=$('#rambleText').value.split('\n').map(x=>x.trim()).filter(Boolean);
      if(!lines.length){toast('Nothing to add'); break;}
      let n=0; lines.forEach(l=>{const p=parseQuickAdd(l); if(p.title){addTaskFromParse(p); n++;}});
      save(); SFX.add(); $('#rambleText').value=''; render(); toast(n+' tasks added 🎙️'); break;}
    case 'assist-extract': {
      const raw=$('#assistText').value;
      const lines=raw.split('\n').map(x=>x.replace(/^[\s•\-\*\d\.\)]+/,'').trim()).filter(x=>x.length>2);
      if(!lines.length){toast('No lines found'); break;}
      $('#assistOut').innerHTML=lines.map((l,i)=>'<div class="subtask"><input type="checkbox" class="asst-chk" data-t="'+esc(l)+'" checked style="width:19px;height:19px"> <span style="flex:1">'+esc(l)+'</span></div>').join('')
        +'<button class="btn red" data-act="assist-add" style="margin-top:10px">Add selected as tasks</button>';
      break;}
    case 'assist-add': {
      let n=0; document.querySelectorAll('.asst-chk:checked').forEach(c=>{const p=parseQuickAdd(c.dataset.t); if(p.title){addTaskFromParse(p); n++;}});
      save(); SFX.add(); sub=null; view='today'; render(); toast(n+' tasks added 🤖'); break;}
    case 'backup-now':
      S.backups.unshift({id:uid(),at:Date.now(),auto:false,data:snapshot()}); S.backups=S.backups.slice(0,10); save(); render(); toast('Backup saved 💾'); break;
    case 'restore': {
      const b=S.backups.find(b=>b.id===id); if(!b)break;
      if(!confirm('Restore this backup? Current data will be replaced.'))break;
      try{const d=JSON.parse(b.data); S.tasks=d.tasks||[]; S.projects=d.projects||[]; S.labels=d.labels||[]; S.filters=d.filters||[]; S.completions=d.completions||[]; S.activities=d.activities||[];
        S.tasks.forEach(syncReminder); save(); sub=null; render(); toast('Restored ✅');}catch(err){toast('Backup is corrupted');}
      break;}
    case 'export': $('#ioText').value=snapshot(); $('#ioText').select(); toast('JSON ready — copy it'); break;
    case 'import': {
      try{const d=JSON.parse($('#ioText').value); if(!d.tasks)throw 0;
        S.tasks=d.tasks; S.projects=d.projects||[]; S.labels=d.labels||[]; S.filters=d.filters||[]; S.completions=d.completions||[]; S.activities=d.activities||[];
        S.tasks.forEach(syncReminder); save(); render(); toast('Imported ✅');}catch(err){toast('Invalid JSON');}
      break;}
  }
});
$('#fab').addEventListener('click',()=>openQuickAdd(null));
window.__gbtBack=function(){
  if($('#sheetroot').innerHTML){closeSheet(); return;}
  if(sub){sub=null; render(); return;}
};
/* ---------- sound effects: tiny WebAudio synth, a different voice per action ---------- */
let AC=null;
function soundsOn(){return localStorage.getItem('gbt_sounds')!=='off';}
function ac(){
  if(!soundsOn())return null;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(fA,fB,dur,type,vol,delay){
  const c=ac(); if(!c)return;
  const t0=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(Math.max(fA,1),t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(fB,1),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
function whoosh(dur,vol,fA,fB){
  const c=ac(); if(!c)return;
  const n=Math.max(1,Math.floor(c.sampleRate*dur)), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.1;
  const t0=c.currentTime;
  f.frequency.setValueAtTime(fA,t0);
  f.frequency.exponentialRampToValueAtTime(fB,t0+dur);
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+dur*0.35);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t0); src.stop(t0+dur+0.05);
}
const SFX={
  tap(){tone(1150,840,0.055,'sine',0.09);},
  hold(){tone(330,180,0.12,'triangle',0.15);},
  nav(){tone(760,560,0.06,'sine',0.06);},
  open(){whoosh(0.17,0.05,480,2500); tone(520,780,0.10,'sine',0.045);},
  close(){whoosh(0.13,0.04,2300,420);},
  add(){tone(620,940,0.09,'sine',0.12); tone(1245,1245,0.08,'sine',0.06,0.055);},
  complete(){tone(659,659,0.10,'sine',0.12); tone(880,880,0.15,'sine',0.12,0.08); tone(1319,1319,0.20,'sine',0.05,0.08);},
  del(){tone(400,130,0.15,'sawtooth',0.05);},
  tick(){tone(990,990,0.045,'square',0.045);}
};
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('.menuitem,.chip,.wp-swatch,.cal .day,.task .body,.btn.ghost,.subtask .box'))SFX.tap();
},{passive:true});
/* ---------- long-press: glass lens response + haptic tick ---------- */
let pressTimer=null;
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.task,.menuitem,.chip,.btn,nav.bottom button'); if(!t)return;
  clearTimeout(pressTimer);
  pressTimer=setTimeout(()=>{t.classList.add('pressing'); SFX.hold(); if(navigator.vibrate)navigator.vibrate(6);},150);
},{passive:true});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{
  clearTimeout(pressTimer);
  document.querySelectorAll('.pressing').forEach(x=>x.classList.remove('pressing'));
},{passive:true}));
document.addEventListener('pointermove',()=>clearTimeout(pressTimer),{passive:true});
/* ---------- wallpaper photo upload: downscale + store on device ---------- */
document.addEventListener('change',e=>{
  if(e.target.id!=='wpFile')return;
  const file=e.target.files&&e.target.files[0]; if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1080, sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      try{
        localStorage.setItem('gbt_wallpaper_img',cv.toDataURL('image/jpeg',0.82));
        localStorage.setItem('gbt_wallpaper','custom');
        applyWallpaper(); render(); toast('Wallpaper set 🖼️');
      }catch(err){ toast('Photo too large for on-device storage'); }
    };
    img.onerror=()=>toast('Could not read that photo');
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
});
/* ---------- boot ---------- */
document.body.dataset.glass=localStorage.getItem('gbt_glass')||'default';
applyWallpaper();
load();
autoBackup(); save();
S.tasks.forEach(syncReminder);
render();
</script>
